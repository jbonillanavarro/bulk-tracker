function kebabToCamel(str) { return str.replace(/-([a-z])/g, (_, c) => c.toUpperCase()); }
function convertAttrs(attrs) {
  const out = {};
  for (const key in attrs) out[kebabToCamel(key)] = attrs[key];
  return out;
}
function renderLucideNode([tag, attrs = {}, children = []], key) {
  return React.createElement(tag, { key, ...convertAttrs(attrs) }, children.map((c, i) => renderLucideNode(c, i)));
}

  return function LucideIcon({ size = 24, color = "currentColor", strokeWidth = 2, style, ...rest }) {
    const [tag, attrs = {}, children = []] = iconNode;
    const mergedAttrs = { ...convertAttrs(attrs), width: size, height: size, stroke: color, strokeWidth, style, ...rest };
    return React.createElement(tag, mergedAttrs, children.map((c, i) => renderLucideNode(c, i)));
  };
}

// Franja horaria actual, para priorizar combinaciones habituales de esa comida. Fuera de las
// franjas típicas (madrugada) solo se ofrecen opciones ligeras marcadas como "cualquiera".
function getMealBucket() {
  const hour = new Date().getHours();
  if (hour >= 6 && hour < 11) return "desayuno";
  if (hour >= 11 && hour < 16) return "comida";
  if (hour >= 16 && hour < 19) return "merienda";
  if (hour >= 19 && hour < 23) return "cena";
  return "cualquiera";
}

// Elige las 3 combinaciones cuyas kcal más se acercan a lo que falta hoy (con un mínimo de 150
// kcal como "porción ligera" para no devolver vacío cuando el objetivo ya está cubierto).
function getFoodSuggestions(remainingKcal, mealBucket) {
  const targetPortion = Math.max(remainingKcal, 150);
  return FOOD_SUGGESTIONS.filter((f) => f.tags.includes(mealBucket) || f.tags.includes("cualquiera"))
    .slice()
    .sort((a, b) => Math.abs(a.kcal - targetPortion) - Math.abs(b.kcal - targetPortion))
    .slice(0, 3);
}

function pad(n) { return String(n).padStart(2, "0"); }
function toDateStr(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function todayStr() { return toDateStr(new Date()); }
function nowTimeStr() { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function addDays(dateStr, delta) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + delta);
  return toDateStr(dt);
}
function formatDateLabel(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  const label = dt.toLocaleDateString("es-ES", { weekday: "short", day: "numeric", month: "short" });
  return label.charAt(0).toUpperCase() + label.slice(1);
}
function round(n, dec = 0) {
  const f = Math.pow(10, dec);
  return Math.round((Number(n) || 0) * f) / f;
}
// Los teclados numéricos en móviles en español insertan "," como separador decimal, que
// <input type="number"> no acepta. Los campos decimales usan type="text" y pasan por aquí.
function parseDecimal(str) {
  return Number(String(str).trim().replace(",", "."));
}
function emptyDay(date) { return { date, weight: null, foods: [], exercise: null, sleepHours: null }; }
function getSleepHours(day) { return day && typeof day.sleepHours === "number" ? day.sleepHours : null; }
function dateDiffDays(a, b) {
  const [ay, am, ad] = a.split("-").map(Number);
  const [by, bm, bd] = b.split("-").map(Number);
  const da = new Date(ay, am - 1, ad);
  const db = new Date(by, bm - 1, bd);
  return Math.round((db - da) / 86400000);
}

// Sugerencia de ajuste de objetivo calórico, transparente y basada en dos señales de las últimas 2 semanas:
// tasa real de cambio de peso (ISSN: ritmo sano de bulking ~0.25-0.5%/semana; >0.7-0.8 kg/semana es demasiado rápido)
// y si se ha sostenido el objetivo calórico actual (±10%). Nunca se aplica sola: solo se sugiere.
function computeTargetSuggestion(allDays, targetKcal) {
  const today = todayStr();
  const windowStart = addDays(today, -13);
  const weightsInWindow = allDays
    .filter((d) => d.date >= windowStart && d.date <= today && d.weight)
    .sort((a, b) => (a.date < b.date ? -1 : 1));
  if (weightsInWindow.length < 2) return null;
  const first = weightsInWindow[0];
  const last = weightsInWindow[weightsInWindow.length - 1];
  const daySpan = dateDiffDays(first.date, last.date);
  if (daySpan < 10) return null;
  const deltaKg = last.weight.value - first.weight.value;
  const ratePerWeek = deltaKg / (daySpan / 7);

  if (ratePerWeek >= 0.8) {
    return { type: "decrease", deltaKcal: -200, deltaCarbs: -50, ratePerWeek: round(ratePerWeek, 2) };
  }

  const loggedDays = allDays.filter((d) => d.date >= windowStart && d.date <= today && d.foods.length > 0);
  if (loggedDays.length < 10) return null;
  const adherentDays = loggedDays.filter((d) => {
    const kcal = d.foods.reduce((a, f) => a + (Number(f.kcal) || 0), 0);
    return kcal >= targetKcal * 0.9 && kcal <= targetKcal * 1.1;
  });
  const adherenceRatio = adherentDays.length / loggedDays.length;

  if (ratePerWeek <= 0.15 && adherenceRatio >= 0.7) {
    return {
      type: "increase",
      deltaKcal: 200,
      deltaCarbs: 50,
      ratePerWeek: round(ratePerWeek, 2),
      adherenceRatio: round(adherenceRatio * 100),
    };
  }
  return null;
}

// Proyección de peso a 4 semanas, calculada de forma transparente: toma la tasa real de cambio
// (primera y última pesada de los últimos ~14 días) y la extrapola linealmente. No es un modelo
// predictivo ni tiene en cuenta cambios futuros de hábitos — es solo "si sigues al ritmo actual".
function computeWeightProjection(weightHistory) {
  if (weightHistory.length === 0) return null;
  const today = todayStr();
  const windowStart = addDays(today, -13);
  const recent = weightHistory.filter((w) => w.date >= windowStart);
  if (recent.length < 2) return null;
  const first = recent[0];
  const last = recent[recent.length - 1];
  const daySpan = dateDiffDays(first.date, last.date);
  if (daySpan < 10) return null;
  const ratePerWeek = round((last.value - first.value) / (daySpan / 7), 2);
  const currentValue = weightHistory[weightHistory.length - 1].value;
  const currentDate = weightHistory[weightHistory.length - 1].date;
  const horizonWeeks = 4;
  const projectedDate = addDays(currentDate, horizonWeeks * 7);
  const projectedValue = round(currentValue + ratePerWeek * horizonWeeks, 1);
  return { ratePerWeek, currentValue, currentDate, projectedDate, projectedValue, horizonWeeks };
}

// Umbral de sueño insuficiente: 7h, límite inferior del rango recomendado para adultos por la
// National Sleep Foundation (7-9h/noche). Déficit "significativo": más de un 15% por debajo del
// objetivo calórico (fuera de la banda ±10% ya usada para la sugerencia de ajuste de objetivos).
function evaluateDayDeviation(day, targetKcal) {
  const sleep = getSleepHours(day);
  const hasAnyData = day.foods.length > 0 || !!day.weight || !!day.exercise || sleep !== null;
  if (!hasAnyData) return null;
  const reasons = [];
  if (day.foods.length > 0) {
    const kcal = day.foods.reduce((a, f) => a + (Number(f.kcal) || 0), 0);
    if (kcal < targetKcal * 0.85) reasons.push("déficit calórico significativo");
  }
  if ((day.foods.length > 0 || day.weight) && !day.exercise) reasons.push("sin entreno");
  if (sleep !== null && sleep < 7) reasons.push("sueño insuficiente");
  return { hasDeviation: reasons.length > 0, reasons };
}

// Correlación puramente descriptiva (no causal): compara el cambio de peso del día siguiente
// a un día desviado del plan frente al de días dentro del plan. Solo se muestra con datos
// suficientes (al menos 3 pares de cada tipo) para no sacar conclusiones de 1-2 días sueltos.
function computeDeviationCorrelation(allDays, targetKcal) {
  const byDate = {};
  allDays.forEach((d) => { byDate[d.date] = d; });
  const afterDeviated = [];
  const afterNormal = [];
  allDays.forEach((d) => {
    const evalResult = evaluateDayDeviation(d, targetKcal);
    if (!evalResult) return;
    const nextDay = byDate[addDays(d.date, 1)];
    if (!nextDay || !d.weight || !nextDay.weight) return;
    const delta = round(nextDay.weight.value - d.weight.value, 2);
    if (evalResult.hasDeviation) afterDeviated.push(delta);
    else afterNormal.push(delta);
  });
  if (afterDeviated.length < 3 || afterNormal.length < 3) return null;
  const avg = (arr) => round(arr.reduce((a, b) => a + b, 0) / arr.length, 2);
  return {
    avgAfterDeviated: avg(afterDeviated),
    avgAfterNormal: avg(afterNormal),
    nDeviated: afterDeviated.length,
    nNormal: afterNormal.length,
  };
}

// Recordatorio de registrar sueño de ayer + aviso si la media reciente (últimos 7 días con
// dato, mínimo 3 para no ser ruido) está por debajo de las 7h recomendadas por la NSF.
function computeSleepInsight(allDays) {
  const today = todayStr();
  const yesterday = addDays(today, -1);
  const hasHistory = allDays.some((d) => d.date < today);
  const yesterdayDay = allDays.find((d) => d.date === yesterday);
  const missingYesterday = hasHistory && !(yesterdayDay && typeof yesterdayDay.sleepHours === "number");
  const windowStart = addDays(today, -6);
  const recentSleeps = allDays
    .filter((d) => d.date >= windowStart && d.date <= today && typeof d.sleepHours === "number")
    .map((d) => d.sleepHours);
  const avgRecent = recentSleeps.length >= 3 ? round(recentSleeps.reduce((a, b) => a + b, 0) / recentSleeps.length, 1) : null;
  const lowAvg = avgRecent !== null && avgRecent < 7;
  return { missingYesterday, avgRecent, lowAvg };
}

function loadAll() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    console.error("Error leyendo datos guardados", e);
    return {};
  }
}
function saveAll(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return true;
  } catch (e) {
    console.error("Error guardando datos", e);
    return false;
  }
}
function loadApiKey() {

}

  } catch (e) { return false; }
}

      carbs: Number(parsed.carbs) > 0 ? Number(parsed.carbs) : DEFAULT_TARGETS.carbs,

  } catch (e) {
    return { ...DEFAULT_TARGETS };
  }
}

    return true;
  } catch (e) { return false; }
}

  const [foodName, setFoodName] = useState("");

  const [weightInput, setWeightInput] = useState("");
  const [weightError, setWeightError] = useState("");

  const [sleepInput, setSleepInput] = useState("");
  const [sleepError, setSleepError] = useState("");

  const [exerciseType, setExerciseType] = useState("");
  const [exerciseNotes, setExerciseNotes] = useState("");

  const [foodMode, setFoodMode] = useState("manual");
  const [photoData, setPhotoData] = useState(null);
  const [photoWeight, setPhotoWeight] = useState("");
  const [photoKnownName, setPhotoKnownName] = useState("");
  const [photoKnownKcal, setPhotoKnownKcal] = useState("");
  const [estimating, setEstimating] = useState(false);
  const [estimateError, setEstimateError] = useState("");
  const [estimatedFlag, setEstimatedFlag] = useState(false);
  const [foodWeight, setFoodWeight] = useState("");
  const [foodWeightBaseline, setFoodWeightBaseline] = useState(null);

  const [aiSuggestions, setAiSuggestions] = useState(null);
  const [aiSuggestLoading, setAiSuggestLoading] = useState(false);
  const [aiSuggestError, setAiSuggestError] = useState("");

  const dayData = allData[currentDate] || emptyDay(currentDate);

  useEffect(() => {
    const d = allData[currentDate];
    setWeightInput(d && d.weight ? String(d.weight.value) : "");
    setSleepInput(d && typeof d.sleepHours === "number" ? String(d.sleepHours) : "");
    if (d && d.exercise) {
      setExerciseType(d.exercise.type);
      setExerciseNotes(d.exercise.notes || "");
    } else {
      setExerciseType("");
      setExerciseNotes("");
    }
    setWeightError("");
    setSleepError("");
    setFoodError("");
    setAiSuggestions(null);
    setAiSuggestError("");
  }, [currentDate]);

  useEffect(() => {
    setTargetsDraft({ kcal: String(targets.kcal), protein: String(targets.protein), fat: String(targets.fat), carbs: String(targets.carbs) });
  }, [targets]);

  const persist = (nextData) => {
    setError("");
    const ok = saveAll(nextData);
    if (!ok) setError("No se pudo guardar en este dispositivo. Comprueba el espacio de almacenamiento.");
  };

  const updateDay = (date, updater) => {
    setAllData((prev) => {
      const current = prev[date] || emptyDay(date);
      const updated = updater(current);
      const next = { ...prev, [date]: updated };
      persist(next);
      return next;
    });
  };

  const totals = useMemo(() => {
    return dayData.foods.reduce(
      (acc, f) => ({
        kcal: acc.kcal + (Number(f.kcal) || 0),
        protein: acc.protein + (Number(f.protein) || 0),
        fat: acc.fat + (Number(f.fat) || 0),
        carbs: acc.carbs + (Number(f.carbs) || 0),
      }),
      { kcal: 0, protein: 0, fat: 0, carbs: 0 }
    );
  }, [dayData]);

  const kcalPct = Math.min(100, round((totals.kcal / targets.kcal) * 100));
  const kcalRemaining = targets.kcal - totals.kcal;

  const resetFoodForm = () => {
    setFoodName(""); setFoodKcal(""); setFoodProtein(""); setFoodFat(""); setFoodCarbs("");
    setFoodError(""); setPhotoData(null); setPhotoWeight("");
    setPhotoKnownName(""); setPhotoKnownKcal(""); setEstimateError(""); setEstimatedFlag(false);
    setFoodWeight(""); setFoodWeightBaseline(null);
  };

  const handleFoodWeightChange = (rawValue) => {
    setFoodWeight(rawValue);
    if (!foodWeightBaseline) return;
    const newWeight = parseDecimal(rawValue);
    if (!(newWeight > 0)) return;
    const scale = newWeight / foodWeightBaseline.weight;
    setFoodKcal(String(round(foodWeightBaseline.kcal * scale)));
    setFoodProtein(String(round(foodWeightBaseline.protein * scale)));
    setFoodFat(String(round(foodWeightBaseline.fat * scale)));
    setFoodCarbs(String(round(foodWeightBaseline.carbs * scale)));
  };

  const handlePhotoSelect = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setEstimateError(""); setEstimatedFlag(false);
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      const match = /^data:(.+);base64,(.*)$/.exec(dataUrl);
      if (!match) { setEstimateError("No se pudo leer la imagen."); return; }
      setPhotoData({ mediaType: match[1], base64: match[2], previewUrl: dataUrl });
    };
    reader.onerror = () => setEstimateError("No se pudo leer la imagen.");
    reader.readAsDataURL(file);
  };

  const handleEstimatePhoto = async () => {
    if (!photoData) { setEstimateError("Sube una foto primero."); return; }
    const activeKey = apiProvider === "gemini" ? geminiApiKey : apiKey;
    if (!activeKey) {
      setEstimateError(
        apiProvider === "gemini"
          ? "Añade tu clave de API de Gemini en Ajustes (icono de arriba) para usar esta función."
          : "Añade tu clave de API en Ajustes (icono de arriba) para usar esta función."
      );
      return;
    }
    setEstimating(true); setEstimateError("");
    try {
      const weightNote = photoWeight
        ? ` El peso aproximado de esta ración es ${photoWeight}g; ajusta tu estimación a esa cantidad.`
        : " No conozco el peso exacto, estima a partir del tamaño visual de la ración.";
      const nameNote = photoKnownName.trim()
        ? ` El plato es: "${photoKnownName.trim()}".`
        : "";
      const kcalNote = photoKnownKcal
        ? ` Ya sé que este plato tiene aproximadamente ${photoKnownKcal} kcal (por ejemplo, por el envase o una fuente externa); usa ese dato como referencia principal para las kcal y ajusta los macros de forma coherente con él.`
        : "";
      const promptText =
        "Eres un nutricionista estimando las calorías y macronutrientes de un plato de comida a partir de una foto." +
        weightNote + nameNote + kcalNote +
        ' Responde ÚNICAMENTE con un objeto JSON válido, sin texto adicional, sin markdown, sin bloques de código, con exactamente estas claves: ' +
        '{"nombre": "string breve describiendo el plato", "peso_g": number, "kcal": number, "proteina_g": number, "grasa_g": number, "carbohidratos_g": number}. ' +
        "peso_g es el peso neto estimado de la ración en gramos (el que te haya dado el usuario si lo hay, o tu propia estimación visual si no). " +
        "Los valores numéricos deben ser solo números (sin unidades, sin texto).";

      let textResponse;
      if (apiProvider === "gemini") {
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${encodeURIComponent(activeKey)}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: promptText },
                  { inline_data: { mime_type: photoData.mediaType, data: photoData.base64 } },
                ],
              }],
            }),
          }
        );
        const data = await response.json();
        if (data.error) throw new Error(data.error.message || "Error de la API de Gemini");
        const candidate = data.candidates && data.candidates[0];
        textResponse = candidate && candidate.content && candidate.content.parts
          ? candidate.content.parts.map((p) => p.text || "").join("\n")
          : "";
        if (!textResponse) throw new Error("Gemini no devolvió una respuesta utilizable.");
      } else {
        const response = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-api-key": activeKey,
            "anthropic-version": "2023-06-01",
            "anthropic-dangerous-direct-browser-access": "true",
          },
          body: JSON.stringify({
            model: "claude-sonnet-4-6",
            max_tokens: 500,
            messages: [{
              role: "user",
              content: [
                { type: "image", source: { type: "base64", media_type: photoData.mediaType, data: photoData.base64 } },
                { type: "text", text: promptText },
              ],
            }],
          }),
        });
        const data = await response.json();
        if (data.error) throw new Error(data.error.message || "Error de la API");
        textResponse = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
      }
      const cleaned = textResponse.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(cleaned);

      const estimatedKcal = round(Number(parsed.kcal) || 0);
      const estimatedProtein = round(Number(parsed.proteina_g) || 0);
      const estimatedFat = round(Number(parsed.grasa_g) || 0);
      const estimatedCarbs = round(Number(parsed.carbohidratos_g) || 0);
      const aiWeight = Number(parsed.peso_g);
      const baselineWeight = photoWeight ? Number(photoWeight) : (aiWeight > 0 ? round(aiWeight) : null);

      setFoodName(parsed.nombre || "Comida (foto)");
      setFoodKcal(String(estimatedKcal));
      setFoodProtein(String(estimatedProtein));
      setFoodFat(String(estimatedFat));
      setFoodCarbs(String(estimatedCarbs));
      if (baselineWeight > 0) {
        setFoodWeight(String(baselineWeight));
        setFoodWeightBaseline({ weight: baselineWeight, kcal: estimatedKcal, protein: estimatedProtein, fat: estimatedFat, carbs: estimatedCarbs });
      } else {
        setFoodWeight("");
        setFoodWeightBaseline(null);
      }
      setEstimatedFlag(true);
    } catch (e) {
      console.error(e);
      setEstimateError("No se pudo estimar la foto (" + e.message + "). Puedes escribir los valores a mano.");
    } finally {
      setEstimating(false);
    }
  };

  const handleAddFood = (e) => {
    e.preventDefault();
    if (!foodName.trim()) { setFoodError("Escribe el nombre de la comida."); return; }
    if (!foodKcal || Number(foodKcal) <= 0) { setFoodError("Indica las calorías."); return; }
    setFoodError("");
    const newFood = {
      id: `${Date.now()}`,
      name: foodName.trim(),
      kcal: round(Number(foodKcal)),
      protein: round(Number(foodProtein) || 0),
      fat: round(Number(foodFat) || 0),
      carbs: round(Number(foodCarbs) || 0),
      time: nowTimeStr(),
    };
    updateDay(currentDate, (d) => ({ ...d, foods: [...d.foods, newFood] }));
    resetFoodForm();
    setFoodMode("manual");
    setAiSuggestions(null);
  };

  const handleDeleteFood = (id) => {
    updateDay(currentDate, (d) => ({ ...d, foods: d.foods.filter((f) => f.id !== id) }));
  };

  const handleAddSuggestedFood = (item) => {
    const newFood = {
      id: `${Date.now()}`,
      name: item.name,
      kcal: round(item.kcal),
      protein: round(item.protein),
      fat: round(item.fat),
      carbs: round(item.carbs),
      time: nowTimeStr(),
    };
    updateDay(currentDate, (d) => ({ ...d, foods: [...d.foods, newFood] }));
    setAiSuggestions(null);
  };

  const handleSuggestWithAI = async () => {
    const activeKey = apiProvider === "gemini" ? geminiApiKey : apiKey;
    if (!activeKey) {
      setAiSuggestError(
        apiProvider === "gemini"
          ? "Añade tu clave de API de Gemini en Ajustes para usar esta función."
          : "Añade tu clave de API en Ajustes para usar esta función."
      );
      return;
    }
    setAiSuggestLoading(true); setAiSuggestError("");
    try {
      const remainingKcal = round(targets.kcal - totals.kcal);
      const remainingProtein = round(targets.protein - totals.protein);
      const remainingFat = round(targets.fat - totals.fat);
      const remainingCarbs = round(targets.carbs - totals.carbs);
      const mealBucket = getMealBucket();
      const promptText =
        "Eres un nutricionista proponiendo comidas concretas (no consejos genéricos) para una persona en fase de volumen (bulking). " +
        `Ahora mismo toca ${mealBucket === "cualquiera" ? "un tentempié ligero" : mealBucket}. ` +
        `Le faltan hoy aproximadamente ${remainingKcal} kcal, ${remainingProtein}g de proteína, ${remainingFat}g de grasa y ${remainingCarbs}g de carbohidratos para llegar a su objetivo diario. ` +
        'Propón exactamente 3 combinaciones de alimentos concretas y variadas (por ejemplo "2 yogures griegos + un puñado de almendras"), nunca consejos genéricos como "come algo proteico". ' +
        'Responde ÚNICAMENTE con un array JSON válido, sin texto adicional, sin markdown, sin bloques de código, con exactamente este formato: ' +
        '[{"nombre": "string describiendo la combinación concreta", "kcal": number, "proteina_g": number, "grasa_g": number, "carbohidratos_g": number}, ...]. ' +
        "Los valores numéricos deben ser solo números (sin unidades, sin texto).";

      let textResponse;
      if (apiProvider === "gemini") {
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${encodeURIComponent(activeKey)}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] }),
          }
        );
        const data = await response.json();
        if (data.error) throw new Error(data.error.message || "Error de la API de Gemini");
        const candidate = data.candidates && data.candidates[0];
        textResponse = candidate && candidate.content && candidate.content.parts
          ? candidate.content.parts.map((p) => p.text || "").join("\n")
          : "";
        if (!textResponse) throw new Error("Gemini no devolvió una respuesta utilizable.");
      } else {
        const response = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-api-key": activeKey,
            "anthropic-version": "2023-06-01",
            "anthropic-dangerous-direct-browser-access": "true",
          },
          body: JSON.stringify({
            model: "claude-sonnet-4-6",
            max_tokens: 600,
            messages: [{ role: "user", content: [{ type: "text", text: promptText }] }],
          }),
        });
        const data = await response.json();
        if (data.error) throw new Error(data.error.message || "Error de la API");
        textResponse = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
      }
      const cleaned = textResponse.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(cleaned);
      if (!Array.isArray(parsed) || parsed.length === 0) throw new Error("Respuesta con formato inesperado.");
      setAiSuggestions(
        parsed.slice(0, 3).map((p) => ({
          name: p.nombre || "Sugerencia",
          kcal: round(Number(p.kcal) || 0),
          protein: round(Number(p.proteina_g) || 0),
          fat: round(Number(p.grasa_g) || 0),
          carbs: round(Number(p.carbohidratos_g) || 0),
        }))
      );
    } catch (e) {
      console.error(e);
      setAiSuggestError("No se pudo pedir sugerencias a la IA (" + e.message + ").");
    } finally {
      setAiSuggestLoading(false);
    }
  };

  const handleSaveWeight = (e) => {
    e.preventDefault();
    const value = parseDecimal(weightInput);
    if (!weightInput || !(value > 0)) { setWeightError("Introduce un peso válido."); return; }
    setWeightError("");
    updateDay(currentDate, (d) => ({ ...d, weight: { value: round(value, 1), time: nowTimeStr() } }));
  };

  const handleSaveSleep = (e) => {
    e.preventDefault();
    const value = parseDecimal(sleepInput);
    if (!sleepInput || !(value >= 0) || value > 24) {
      setSleepError("Introduce unas horas de sueño válidas (0-24).");
      return;
    }
    setSleepError("");
    updateDay(currentDate, (d) => ({ ...d, sleepHours: round(value, 1) }));
  };

  const handleSaveExercise = (e) => {
    e.preventDefault();
    if (!exerciseType) return;
    updateDay(currentDate, (d) => ({ ...d, exercise: { type: exerciseType, notes: exerciseNotes.trim(), time: nowTimeStr() } }));
  };

  const handleClearExercise = () => {
    setExerciseType(""); setExerciseNotes("");
    updateDay(currentDate, (d) => ({ ...d, exercise: null }));
  };

  const handleSaveApiKey = () => {
    saveApiKey(apiKeyInput.trim());
    setApiKey(apiKeyInput.trim());
    setApiKeyInput("");
    setApiKeySaved(true);
    setTimeout(() => setApiKeySaved(false), 2000);
  };

  const handleClearApiKey = () => {
    saveApiKey("");
    setApiKey("");
  };

  const handleSaveGeminiKey = () => {
    saveGeminiKey(geminiApiKeyInput.trim());
    setGeminiApiKey(geminiApiKeyInput.trim());
    setGeminiApiKeyInput("");
    setGeminiApiKeySaved(true);
    setTimeout(() => setGeminiApiKeySaved(false), 2000);
  };

  const handleClearGeminiKey = () => {
    saveGeminiKey("");
    setGeminiApiKey("");
  };

  const handleSetProvider = (p) => {
    setApiProvider(p);
    saveProvider(p);
  };

  const handleSaveTargets = (e) => {
    e.preventDefault();
    const kcal = Number(targetsDraft.kcal);
    const protein = Number(targetsDraft.protein);
    const fat = Number(targetsDraft.fat);
    const carbs = Number(targetsDraft.carbs);
    if (!(kcal > 0 && protein > 0 && fat > 0 && carbs > 0)) {
      setTargetsError("Todos los objetivos deben ser números mayores que 0.");
      return;
    }
    setTargetsError("");
    const next = { kcal: round(kcal), protein: round(protein), fat: round(fat), carbs: round(carbs) };
    setTargets(next);
    saveTargets(next);
    setTargetsSaved(true);
    setTimeout(() => setTargetsSaved(false), 2000);
  };

  const handleApplySuggestion = () => {
    if (!targetSuggestion) return;
    const next = {
      ...targets,
      kcal: round(targets.kcal + targetSuggestion.deltaKcal),
      carbs: round(targets.carbs + targetSuggestion.deltaCarbs),
    };
    setTargets(next);
    saveTargets(next);
    setSuggestionDismissed(true);
  };

  const handleDiscardSuggestion = () => setSuggestionDismissed(true);

  const handleExportBackup = () => {
    const blob = new Blob([JSON.stringify(allData, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `bulk-tracker-backup-${todayStr()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const handleImportBackup = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setImportError(""); setImportSuccess(false);
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
          throw new Error("el archivo no tiene el formato esperado.");
        }
        for (const key in parsed) {
          const day = parsed[key];
          if (!day || typeof day !== "object" || typeof day.date !== "string") {
            throw new Error("el archivo no es una copia de seguridad válida de Bulk Tracker.");
          }
        }
        const confirmed = window.confirm(
          "Esto reemplazará todos los datos actuales de la app (peso, comidas, entrenos) por los de este archivo. ¿Continuar?"
        );
        if (!confirmed) return;
        setAllData(parsed);
        persist(parsed);
        setImportSuccess(true);
        setTimeout(() => setImportSuccess(false), 2500);
      } catch (err) {
        setImportError("No se pudo restaurar: " + err.message);
      }
    };
    reader.onerror = () => setImportError("No se pudo leer el archivo.");
    reader.readAsText(file);
  };

  const allDays = useMemo(() => Object.values(allData).sort((a, b) => (a.date < b.date ? -1 : 1)), [allData]);
  const weightHistory = useMemo(() => allDays.filter((d) => d.weight).map((d) => ({ date: d.date, value: d.weight.value })), [allDays]);
  const dailyKcalHistory = useMemo(
    () =>
      allDays
        .filter((d) => d.foods.length > 0)
        .map((d) => ({ date: d.date, kcal: d.foods.reduce((a, f) => a + (Number(f.kcal) || 0), 0) })),
    [allDays]
  );
  const avg7 = useMemo(() => {
    const last7 = weightHistory.slice(-7);
    if (last7.length === 0) return null;
    return round(last7.reduce((a, b) => a + b.value, 0) / last7.length, 1);
  }, [weightHistory]);

  const targetSuggestion = useMemo(() => computeTargetSuggestion(allDays, targets.kcal), [allDays, targets.kcal]);
  const weightProjection = useMemo(() => computeWeightProjection(weightHistory), [weightHistory]);
  const deviationCorrelation = useMemo(() => computeDeviationCorrelation(allDays, targets.kcal), [allDays, targets.kcal]);
  const sleepInsight = useMemo(() => computeSleepInsight(allDays), [allDays]);

  const isToday = currentDate === todayStr();

  return (
    <div style={styles.app}>
      <div style={styles.topBar}>
        <span className="bt-num" style={styles.topBarTitle}>BULK TRACKER</span>
        <button style={styles.iconBtn} onClick={() => setShowSettings(true)} aria-label="Ajustes">
          <Settings size={18} color="#9AA0AB" />
        </button>
      </div>

      <div style={styles.container}>
        {error && <div style={styles.errorBanner}>{error}</div>}

        {activeTab === "hoy" && (
          <HoyTab
            currentDate={currentDate} setCurrentDate={setCurrentDate} isToday={isToday}
            dayData={dayData} totals={totals} kcalPct={kcalPct} kcalRemaining={kcalRemaining} targets={targets}
            weightInput={weightInput} setWeightInput={setWeightInput} weightError={weightError} handleSaveWeight={handleSaveWeight}
            sleepInput={sleepInput} setSleepInput={setSleepInput} sleepError={sleepError} handleSaveSleep={handleSaveSleep} sleepInsight={sleepInsight}
            foodName={foodName} setFoodName={setFoodName}
            foodKcal={foodKcal} setFoodKcal={setFoodKcal}
            foodProtein={foodProtein} setFoodProtein={setFoodProtein}
            foodFat={foodFat} setFoodFat={setFoodFat}
            foodCarbs={foodCarbs} setFoodCarbs={setFoodCarbs}
            foodError={foodError} handleAddFood={handleAddFood} handleDeleteFood={handleDeleteFood}
            handleAddSuggestedFood={handleAddSuggestedFood}
            aiSuggestions={aiSuggestions} aiSuggestLoading={aiSuggestLoading} aiSuggestError={aiSuggestError}
            handleSuggestWithAI={handleSuggestWithAI}
            foodMode={foodMode} setFoodMode={setFoodMode}
            photoData={photoData} handlePhotoSelect={handlePhotoSelect}
            photoWeight={photoWeight} setPhotoWeight={setPhotoWeight}
            photoKnownName={photoKnownName} setPhotoKnownName={setPhotoKnownName}
            photoKnownKcal={photoKnownKcal} setPhotoKnownKcal={setPhotoKnownKcal}
            foodWeight={foodWeight} foodWeightBaseline={foodWeightBaseline} handleFoodWeightChange={handleFoodWeightChange}
            handleEstimatePhoto={handleEstimatePhoto} estimating={estimating}
            estimateError={estimateError} estimatedFlag={estimatedFlag} resetFoodForm={resetFoodForm}
            exerciseType={exerciseType} setExerciseType={setExerciseType}
            exerciseNotes={exerciseNotes} setExerciseNotes={setExerciseNotes}
            handleSaveExercise={handleSaveExercise} handleClearExercise={handleClearExercise}
          />
        )}

        {activeTab === "progreso" && (
          <ProgresoTab
            weightHistory={weightHistory} avg7={avg7} allDays={allDays} dailyKcalHistory={dailyKcalHistory} targets={targets}
            targetSuggestion={suggestionDismissed ? null : targetSuggestion}
            handleApplySuggestion={handleApplySuggestion} handleDiscardSuggestion={handleDiscardSuggestion}
            weightProjection={weightProjection}
          />
        )}

        {activeTab === "historial" && (
          <HistorialTab
            allDays={allDays} targets={targets} deviationCorrelation={deviationCorrelation}
            onSelectDay={(date) => { setCurrentDate(date); setActiveTab("hoy"); }}
          />
        )}
      </div>

      <div style={styles.tabBar}>
        <button className={`bt-tab-btn ${activeTab === "hoy" ? "active" : ""}`} onClick={() => setActiveTab("hoy")}>
          <Flame size={20} />Hoy
        </button>
        <button className={`bt-tab-btn ${activeTab === "progreso" ? "active" : ""}`} onClick={() => setActiveTab("progreso")}>
          <TrendingUp size={20} />Progreso
        </button>
        <button className={`bt-tab-btn ${activeTab === "historial" ? "active" : ""}`} onClick={() => setActiveTab("historial")}>
          <CalendarDays size={20} />Historial
        </button>
      </div>

      {showSettings && (
        <div style={styles.modalOverlay} onClick={() => setShowSettings(false)}>
          <div style={styles.modalCard} onClick={(e) => e.stopPropagation()}>
            <div style={styles.cardHeaderRow}>

function FoodSuggestions({ totals, targets, aiSuggestions, aiSuggestLoading, aiSuggestError, handleSuggestWithAI, handleAddSuggestedFood }) {
  const mealBucket = getMealBucket();
  const remainingKcal = round(targets.kcal - totals.kcal);
  const localSuggestions = useMemo(() => getFoodSuggestions(remainingKcal, mealBucket), [remainingKcal, mealBucket]);
  const mealLabel = mealBucket === "cualquiera" ? "tentempié ligero" : mealBucket;
  const items = aiSuggestions || localSuggestions;

  return (
    <section style={styles.card}>
      <div style={{ ...styles.cardHeaderRow, flexWrap: "wrap", gap: 6 }}>
        <span style={styles.cardTitle}>Sugerencias — {mealLabel}</span>
        <button type="button" className="bt-btn-ghost" style={{ padding: "4px 10px" }} onClick={handleSuggestWithAI} disabled={aiSuggestLoading}>
          {aiSuggestLoading ? <Loader2 size={13} style={{ animation: "bt-spin 1s linear infinite" }} /> : "Otra (IA)"}
        </button>
      </div>
      {aiSuggestError && <div style={styles.fieldError}>{aiSuggestError}</div>}
      {aiSuggestions && <div style={styles.estimatedHint}>Sugerido por IA — revisa los valores antes de fiarte del todo.</div>}
      {items.map((item, i) => (
        <div key={i} style={styles.foodRow}>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ ...styles.foodName, whiteSpace: "normal", overflow: "visible", textOverflow: "clip" }}>{item.name}</div>
            <div style={styles.foodMacros}>{item.protein}p · {item.fat}g · {item.carbs}c</div>
          </div>
          <div style={styles.foodKcal}>{item.kcal}</div>
          <button className="bt-btn-ghost" style={{ padding: 6 }} onClick={() => handleAddSuggestedFood(item)} aria-label="Añadir esta sugerencia">
            <Plus size={15} />
          </button>
        </div>
      ))}
    </section>
  );
}

function MacroPill({ label, value, target, unit }) {
  const pct = Math.min(100, round((value / target) * 100));
  return (
    <div style={styles.macroPill}>
      <div style={styles.macroPillTop}>
        <span style={styles.macroPillLabel}>{label}</span>
        <span style={styles.macroPillValue}>{round(value)}{unit}</span>
      </div>
      <div style={styles.macroPillTrack}><div style={{ ...styles.macroPillFill, width: `${pct}%` }} /></div>
    </div>
  );
}

        <div style={styles.statCard}>
          <div style={styles.statLabel}>Con comidas</div>
          <div className="bt-num" style={styles.statValue}>{daysLogged}</div>
        </div>
      </div>
    </div>
  );
}

function WeightLineChart({ data, projection }) {
  const width = 320, height = 150, padTop = 22, padBottom = 22, padX = 8;
  const plotWidth = width - padX * 2;
  const historicalWidth = projection ? plotWidth * 0.78 : plotWidth;
  const values = data.map((d) => d.value);
  const allValues = projection ? [...values, projection.projectedValue] : values;
  const rawMin = Math.min(...allValues), rawMax = Math.max(...allValues);
  const pad = (rawMax - rawMin) * 0.15 || 1;
  const min = rawMin - pad, max = rawMax + pad;
  const range = max - min || 1;
  const points = data.map((d, i) => {
    const x = data.length === 1 ? padX + historicalWidth / 2 : padX + (i / (data.length - 1)) * historicalWidth;
    const y = padTop + (1 - (d.value - min) / range) * (height - padTop - padBottom);
    return { x, y, value: d.value, date: d.date };
  });
  const linePath = points.map((p, i) => `${i === 0 ? "M" : "L"} ${round(p.x, 1)} ${round(p.y, 1)}`).join(" ");
  const areaPath = `${linePath} L ${round(points[points.length - 1].x, 1)} ${height - padBottom} L ${round(points[0].x, 1)} ${height - padBottom} Z`;
  const showEvery = data.length > 8 ? Math.ceil(data.length / 6) : 1;
  const lastPoint = points[points.length - 1];
  const projectedPoint = projection
    ? { x: padX + plotWidth, y: padTop + (1 - (projection.projectedValue - min) / range) * (height - padTop - padBottom) }
    : null;
  const projectionPath = projectedPoint
    ? `M ${round(lastPoint.x, 1)} ${round(lastPoint.y, 1)} L ${round(projectedPoint.x, 1)} ${round(projectedPoint.y, 1)}`
    : null;
  return (
    <div>
      <svg viewBox={`0 0 ${width} ${height}`} style={{ width: "100%", height: "auto", overflow: "visible" }} role="img" aria-label="Gráfico de evolución del peso">
        <path d={areaPath} fill="#E2A63B" opacity="0.08" />
        <path d={linePath} fill="none" stroke="#E2A63B" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
        {projectionPath && (
          <path d={projectionPath} fill="none" stroke="#9AA0AB" strokeWidth="2" strokeDasharray="4 3" strokeLinecap="round" />
        )}
        {points.map((p, i) => (
          <g key={i}>
            <circle cx={p.x} cy={p.y} r={i === points.length - 1 ? 4 : 2.5} fill="#E2A63B" />
            {(i === 0 || i === points.length - 1 || i % showEvery === 0) && (
              <text x={p.x} y={p.y - 8} fontSize="9" fill="#9AA0AB" textAnchor="middle">{p.value}</text>
            )}
          </g>
        ))}
        {projectedPoint && <circle cx={projectedPoint.x} cy={projectedPoint.y} r="3" fill="none" stroke="#9AA0AB" strokeWidth="1.5" />}
      </svg>
      <div style={styles.chartAxisRow}>
        <span style={styles.chartAxisLabel}>{formatDateLabel(data[0].date)}</span>
        <span style={styles.chartAxisLabel}>
          {formatDateLabel(data[data.length - 1].date)}{projection ? ` · proyección a ${formatDateLabel(projection.projectedDate)}` : ""}
        </span>
      </div>
    </div>
  );
}

function KcalBarChart({ data, target }) {
  const width = 320, height = 150, padTop = 22, padBottom = 22, padX = 8;
  const plotHeight = height - padTop - padBottom;
  const values = data.map((d) => d.kcal);
  const max = Math.max(...values, target) * 1.08;
  const slot = (width - padX * 2) / data.length;
  const barWidth = Math.min(28, slot * 0.6);
  const targetY = height - padBottom - (target / max) * plotHeight;
  const showEvery = data.length > 8 ? Math.ceil(data.length / 6) : 1;
  const bars = data.map((d, i) => {
    const cx = padX + slot * (i + 0.5);
    const barHeight = (d.kcal / max) * plotHeight;
    const y = height - padBottom - barHeight;
    return { x: cx - barWidth / 2, y, barHeight, value: d.kcal, date: d.date, onTarget: d.kcal >= target };
  });
  return (
    <div>
      <svg viewBox={`0 0 ${width} ${height}`} style={{ width: "100%", height: "auto", overflow: "visible" }} role="img" aria-label="Gráfico de calorías diarias">
        <line x1={padX} y1={round(targetY, 1)} x2={width - padX} y2={round(targetY, 1)} stroke="#6C7280" strokeWidth="1" strokeDasharray="3 3" />
        <text x={width - padX} y={round(targetY, 1) - 4} fontSize="8" fill="#6C7280" textAnchor="end">objetivo {target.toLocaleString("es-ES")}</text>
        {bars.map((b, i) => (
          <g key={i}>
            <rect x={round(b.x, 1)} y={round(b.y, 1)} width={round(barWidth, 1)} height={round(Math.max(b.barHeight, 1), 1)}
              rx="2" fill={b.onTarget ? "#4F9B8C" : "#E2A63B"} />
            {(data.length <= 8 || i === 0 || i === bars.length - 1 || i % showEvery === 0) && (
              <text x={round(b.x + barWidth / 2, 1)} y={round(b.y, 1) - 4} fontSize="8" fill="#9AA0AB" textAnchor="middle">{round(b.value)}</text>
            )}
          </g>
        ))}
      </svg>
      <div style={styles.chartAxisRow}>
        <span style={styles.chartAxisLabel}>{formatDateLabel(data[0].date)}</span>
        <span style={styles.chartAxisLabel}>{formatDateLabel(data[data.length - 1].date)}</span>
      </div>
    </div>
  );
}

function HistorialTab({ allDays, targets, deviationCorrelation, onSelectDay }) {
  const sorted = [...allDays].sort((a, b) => (a.date < b.date ? 1 : -1));
  if (sorted.length === 0) {
    return (
      <div style={styles.emptyState}>
        <CalendarDays size={28} color="#3A3E46" />
        <p style={styles.emptyTitle}>Sin días registrados</p>
        <p style={styles.emptyBody}>Cuando registres peso, comidas o entreno, aparecerán aquí.</p>
      </div>
    );
  }
  return (
    <div>
      {deviationCorrelation && (
        <p style={styles.projectionNote}>
          Observación (no es causalidad, solo un patrón en tus propios datos): tras un día marcado como desviado del plan,
          el peso del día siguiente cambió de media {deviationCorrelation.avgAfterDeviated >= 0 ? "+" : ""}{deviationCorrelation.avgAfterDeviated} kg
          (sobre {deviationCorrelation.nDeviated} días), frente a {deviationCorrelation.avgAfterNormal >= 0 ? "+" : ""}{deviationCorrelation.avgAfterNormal} kg
          tras días dentro del plan (sobre {deviationCorrelation.nNormal} días).
        </p>
      )}
      {sorted.map((d) => {
        const kcal = d.foods.reduce((a, f) => a + (Number(f.kcal) || 0), 0);
        const deviation = evaluateDayDeviation(d, targets.kcal);
        return (
          <button key={d.date} onClick={() => onSelectDay(d.date)} style={styles.historyRow}>
            <div style={{ textAlign: "left" }}>
              <div style={styles.historyDate}>
                {formatDateLabel(d.date)}
                {deviation && deviation.hasDeviation && (
                  <span style={styles.deviationDot} title={`Desviado del plan: ${deviation.reasons.join(", ")}`} />
                )}
              </div>
              <div style={styles.historyMeta}>
                {d.foods.length > 0 ? `${round(kcal)} kcal` : "sin comidas"}
                {d.exercise ? ` · ${d.exercise.type}` : ""}
              </div>
            </div>
            <div style={styles.historyWeight}>{d.weight ? `${d.weight.value} kg` : "—"}</div>
          </button>
        );
      })}
    </div>
  );
}
